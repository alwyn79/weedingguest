<script>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxWI0_Xp6nR4WsUYR7muF-rWyaAJdpNUJ28UA-wymiW2RLQ-rGOoZLRZK5y_UxpjZ_M/exec";

let allGuests = [];

// LOAD PAGE
window.addEventListener('DOMContentLoaded', () => {
  loadGuests();
});

// NAVIGATION
function showPage(id, btn){

  document.querySelectorAll('.page')
    .forEach(p => p.classList.remove('active'));

  document.querySelectorAll('.nav-btn')
    .forEach(b => b.classList.remove('active'));

  document.getElementById('page-' + id)
    .classList.add('active');

  btn.classList.add('active');

  if(id === 'list'){
    filterTable();
  }
}

// LOAD GUESTS
async function loadGuests(){

  try{

    const res = await fetch(`${SCRIPT_URL}?action=getAll`);

    const data = await res.json();

    if(!data.success){
      throw new Error(data.error);
    }

    allGuests = data.guests || [];

    updateStats();

    filterTable();

  }catch(err){

    console.error(err);

    showToast('Failed loading guests', true);

  }
}

// ADD GUEST
async function addGuest(){

  const name = document.getElementById('inp-name').value.trim();

  const place = document.getElementById('inp-place').value.trim();

  const relation = document.getElementById('inp-relation').value;

  const status = document.getElementById('inp-status').value;

  if(!name){
    showToast('Enter guest name', true);
    return;
  }

  try{

    const res = await fetch(SCRIPT_URL,{
      method:'POST',
      headers:{
        'Content-Type':'text/plain'
      },
      body:JSON.stringify({
        action:'add',
        name,
        place,
        relation,
        status
      })
    });

    const data = await res.json();

    if(!data.success){
      throw new Error(data.error);
    }

    document.getElementById('inp-name').value = '';
    document.getElementById('inp-place').value = '';

    showToast('Guest added ✓');

    loadGuests();

  }catch(err){

    console.error(err);

    showToast('Failed adding guest', true);

  }
}

// FILTER TABLE
function filterTable(){

  const tbody = document.getElementById('guest-tbody');

  const search = document.getElementById('search-input')
    .value
    .toLowerCase();

  const status = document.getElementById('filter-status').value;

  let filtered = allGuests.filter(g => {

    const matchSearch =
      g.name.toLowerCase().includes(search) ||
      (g.place || '').toLowerCase().includes(search);

    const matchStatus =
      status === 'all' || g.status === status;

    return matchSearch && matchStatus;

  });

  tbody.innerHTML = filtered.map(g => `
    <tr>

      <td>${g.name}</td>

      <td>${g.place || '-'}</td>

      <td>${g.relation || '-'}</td>

      <td>
        <select
          onchange="changeStatus('${g.id}', this.value)"
          class="status-badge ${g.status}"
          style="
            border:none;
            padding:8px 12px;
            border-radius:20px;
            font-size:.75rem;
            cursor:pointer;
          "
        >

          <option
            value="need"
            ${g.status === 'need' ? 'selected' : ''}
          >
            Need to Contact
          </option>

          <option
            value="contacted"
            ${g.status === 'contacted' ? 'selected' : ''}
          >
            Contacted
          </option>

        </select>
      </td>

      <td>
        <button
          class="btn-delete"
          onclick="deleteGuest('${g.id}')"
        >
          ✕
        </button>
      </td>

    </tr>
  `).join('');
}

// CHANGE STATUS
async function changeStatus(id, newStatus){

  const guest = allGuests.find(g => g.id == id);

  if(!guest) return;

  try{

    const res = await fetch(SCRIPT_URL,{
      method:'POST',
      headers:{
        'Content-Type':'text/plain'
      },
      body:JSON.stringify({
        action:'updateStatus',
        id,
        status:newStatus
      })
    });

    const data = await res.json();

    if(!data.success){
      throw new Error(data.error);
    }

    guest.status = newStatus;

    updateStats();

    filterTable();

    showToast('Status updated ✓');

  }catch(err){

    console.error(err);

    showToast('Failed updating status', true);

  }
}

// DELETE GUEST
async function deleteGuest(id){

  if(!confirm('Delete guest?')){
    return;
  }

  try{

    const res = await fetch(SCRIPT_URL,{
      method:'POST',
      headers:{
        'Content-Type':'text/plain'
      },
      body:JSON.stringify({
        action:'delete',
        id
      })
    });

    const data = await res.json();

    if(!data.success){
      throw new Error(data.error);
    }

    showToast('Guest removed');

    loadGuests();

  }catch(err){

    console.error(err);

    showToast('Delete failed', true);

  }
}

// UPDATE STATS
function updateStats(){

  const total = allGuests.length;

  const contacted = allGuests.filter(
    g => g.status === 'contacted'
  ).length;

  document.getElementById('stat-total').textContent = total;

  document.getElementById('stat-contacted').textContent = contacted;

  document.getElementById('stat-pending').textContent =
    total - contacted;
}

// TOAST MESSAGE
let toastTimer;

function showToast(msg, error){

  const t = document.getElementById('toast');

  t.textContent = msg;

  t.className =
    'toast' +
    (error ? ' error' : '') +
    ' show';

  clearTimeout(toastTimer);

  toastTimer = setTimeout(() => {
    t.classList.remove('show');
  }, 3000);
}

</script>
