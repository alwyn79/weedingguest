<script>
// ── CONFIG ──────────────────────────────────────────
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxWI0_Xp6nR4WsUYR7muF-rWyaAJdpNUJ28UA-wymiW2RLQ-rGOoZLRZK5y_UxpjZ_M/exec";

let allGuests = [];

// ── INITIAL LOAD ────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  loadGuests();
});

// ── NAVIGATION ──────────────────────────────────────
function showPage(id, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  btn.classList.add('active');

  if (id === 'list') {
    filterTable();
  }
}

// ── LOAD GUESTS ─────────────────────────────────────
async function loadGuests(silent) {
  if (!silent) setTableLoading(true);

  try {
    const res = await fetch(`${SCRIPT_URL}?action=getAll`);
    const data = await res.json();

    if (!data.success) {
      throw new Error(data.error);
    }

    allGuests = data.guests || [];

    updateStats();
    filterTable();

    if (silent) {
      showToast('Refreshed ✓');
    }

  } catch (err) {
    console.error(err);
    showToast('Could not load guest data.', true);
    setTableLoading(false);
  }
}

function setTableLoading(on) {
  const tbody = document.getElementById('guest-tbody');

  if (on) {
    tbody.innerHTML = `
      <tr class="loading-row">
        <td colspan="7">
          <span class="spinner"></span>
          Loading from Google Sheets…
        </td>
      </tr>
    `;
  }
}

// ── DUPLICATE CHECK ─────────────────────────────────
let pendingAddPayload = null;

function normName(s) {
  return s.trim().toLowerCase().replace(/\s+/g, ' ');
}

function findDuplicate(name) {
  const n = normName(name);
  return allGuests.find(g => normName(g.name) === n);
}

function checkDupLive() {
  const val = document.getElementById('inp-name').value;
  const hint = document.getElementById('dup-hint');
  const inp = document.getElementById('inp-name');

  if (val.length > 1 && findDuplicate(val)) {
    hint.classList.add('show');
    inp.classList.add('dup-warn');
  } else {
    hint.classList.remove('show');
    inp.classList.remove('dup-warn');
  }
}

function openDupModal(name) {
  document.getElementById('dup-name').textContent = name;
  document.getElementById('dup-modal').classList.add('open');
}

function closeDupModal() {
  document.getElementById('dup-modal').classList.remove('open');
  pendingAddPayload = null;
}

async function confirmAddDuplicate() {
  closeDupModal();

  if (pendingAddPayload) {
    await doAddGuest(pendingAddPayload);
  }
}

// ── ADD GUEST ───────────────────────────────────────
async function addGuest() {
  const name = document.getElementById('inp-name').value.trim();
  const place = document.getElementById('inp-place').value.trim();
  const relation = document.getElementById('inp-relation').value;
  const status = document.getElementById('inp-status').value;

  if (!name) {
    showToast('Please enter a guest name!', true);
    return;
  }

  const dup = findDuplicate(name);

  if (dup) {
    pendingAddPayload = { name, place, relation, status };
    openDupModal(dup.name);
    return;
  }

  await doAddGuest({ name, place, relation, status });
}

async function doAddGuest({ name, place, relation, status }) {
  const btn = document.getElementById('btn-add-guest');

  btn.disabled = true;
  btn.textContent = 'Saving…';

  try {
    const res = await postAction({
      action: 'add',
      name,
      place,
      relation,
      status
    });

    const data = await res.json();

    if (!data.success) {
      throw new Error(data.error);
    }

    allGuests.push({
      id: data.id,
      name,
      place,
      relation,
      status,
      addedOn: new Date().toLocaleDateString('en-IN')
    });

    updateStats();
    filterTable();

    document.getElementById('inp-name').value = '';
    document.getElementById('inp-place').value = '';
    document.getElementById('inp-relation').value = '';
    document.getElementById('inp-status').value = 'need';

    document.getElementById('inp-name').classList.remove('dup-warn');
    document.getElementById('dup-hint').classList.remove('show');

    document.getElementById('inp-name').focus();

    showToast(`${name} added ✓`);

  } catch (err) {
    console.error(err);
    showToast('Failed to add guest.', true);

  } finally {
    btn.disabled = false;
    btn.textContent = '+ Add';
  }
}

// ── TOGGLE STATUS ───────────────────────────────────
async function toggleStatus(id, btn) {
  const g = allGuests.find(x => x.id == id);

  if (!g) return;

  const newStatus = g.status === 'need'
    ? 'contacted'
    : 'need';

  btn.disabled = true;

  try {
    const res = await postAction({
      action: 'updateStatus',
      id,
      status: newStatus
    });

    const data = await res.json();

    if (!data.success) {
      throw new Error(data.error);
    }

    g.status = newStatus;

    updateStats();
    filterTable();

    showToast(
      `${g.name} → ${
        newStatus === 'contacted'
          ? 'Contacted ✓'
          : 'Need to Contact'
      }`
    );

  } catch (err) {
    console.error(err);
    showToast('Update failed.', true);
    btn.disabled = false;
  }
}

// ── DELETE ──────────────────────────────────────────
async function deleteGuest(id) {
  const g = allGuests.find(x => x.id == id);

  if (!g) return;

  if (!confirm(`Remove "${g.name}" from the list?`)) {
    return;
  }

  try {
    const res = await postAction({
      action: 'delete',
      id
    });

    const data = await res.json();

    if (!data.success) {
      throw new Error(data.error);
    }

    allGuests = allGuests.filter(x => x.id != id);

    updateStats();
    filterTable();

    showToast(`${g.name} removed`);

  } catch (err) {
    console.error(err);
    showToast('Delete failed.', true);
  }
}

// ── SORT STATE ──────────────────────────────────────
let sortCol = null;
let sortDir = 'asc';

function sortByCol(col) {
  if (sortCol === col) {
    sortDir = sortDir === 'asc'
      ? 'desc'
      : 'asc';
  } else {
    sortCol = col;
    sortDir = 'asc';
  }

  document.getElementById('sort-by').value = 'default';

  document.querySelectorAll('th.sortable').forEach(th => {
    th.classList.remove('asc', 'desc');

    if (th.dataset.col === col) {
      th.classList.add(sortDir);
    }
  });

  filterTable();
}

// ── RENDER TABLE ────────────────────────────────────
function relLabel(r) {
  const map = {
    bride: "Bride's Side",
    groom: "Groom's Side",
    family: "Family",
    friend: "Friend",
    colleague: "Colleague",
    neighbor: "Neighbor",
    other: "Other"
  };

  return map[r] || r || '—';
}

function filterTable() {
  const q = (document.getElementById('search-input').value || '').toLowerCase();

  const filter = document.getElementById('filter-status').value;

  const filterRel = document.getElementById('filter-relation').value;

  const sortBy = document.getElementById('sort-by').value;

  const empty = document.getElementById('empty-state');

  const tbody = document.getElementById('guest-tbody');

  let filtered = allGuests.filter(g => {
    const mq =
      g.name.toLowerCase().includes(q) ||
      (g.place || '').toLowerCase().includes(q) ||
      (g.relation || '').toLowerCase().includes(q);

    const mf = filter === 'all' || g.status === filter;

    const mr = filterRel === 'all' || (g.relation || '') === filterRel;

    return mq && mf && mr;
  });

  const sortFn = sortCol && sortBy === 'default'
    ? (a, b) => {
        let va = (a[sortCol] || '').toString().toLowerCase();
        let vb = (b[sortCol] || '').toString().toLowerCase();

        return sortDir === 'asc'
          ? va.localeCompare(vb)
          : vb.localeCompare(va);
      }
    : (() => {
        switch (sortBy) {
          case 'name-asc':
            return (a, b) => a.name.localeCompare(b.name);

          case 'name-desc':
            return (a, b) => b.name.localeCompare(a.name);

          case 'place-asc':
            return (a, b) => (a.place || '').localeCompare(b.place || '');

          case 'relation-asc':
            return (a, b) => (a.relation || '').localeCompare(b.relation || '');

          case 'status-need':
            return (a, b) =>
              (a.status === 'need' ? -1 : 1) -
              (b.status === 'need' ? -1 : 1);

          case 'status-contacted':
            return (a, b) =>
              (a.status === 'contacted' ? -1 : 1) -
              (b.status === 'contacted' ? -1 : 1);

          case 'date-new':
            return (a, b) => (b.id || 0) - (a.id || 0);

          case 'date-old':
            return (a, b) => (a.id || 0) - (b.id || 0);

          default:
            return null;
        }
      })();

  if (sortFn) {
    filtered = [...filtered].sort(sortFn);
  }

  if (filtered.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    return;
  }

  empty.style.display = 'none';

  tbody.innerHTML = filtered.map((g, i) => `
    <tr>
      <td class="td-serial">${i + 1}</td>

      <td><strong>${esc(g.name)}</strong></td>

      <td class="td-place">
        ${esc(g.place || '—')}
      </td>

      <td>
        ${
          g.relation
            ? `<span class="rel-badge rel-${esc(g.relation)}">
                 ${esc(relLabel(g.relation))}
               </span>`
            : '<span style="color:#ccc">—</span>'
        }
      </td>

      <td>
        <button
          class="status-badge ${g.status}"
          onclick="toggleStatus('${g.id}', this)"
        >
          <span class="status-dot"></span>

          ${
            g.status === 'need'
              ? 'Need to Contact'
              : 'Contacted'
          }
        </button>
      </td>

      <td class="td-date">
        ${esc(g.addedOn || '')}
      </td>

      <td>
        <button
          class="btn-delete"
          onclick="deleteGuest('${g.id}')"
          title="Remove"
        >
          ✕
        </button>
      </td>
    </tr>
  `).join('');
}

// ── STATS ───────────────────────────────────────────
function updateStats() {
  const total = allGuests.length;

  const contacted = allGuests.filter(
    g => g.status === 'contacted'
  ).length;

  document.getElementById('stat-total').textContent = total;

  document.getElementById('stat-contacted').textContent = contacted;

  document.getElementById('stat-pending').textContent =
    total - contacted;
}

// ── HELPERS ─────────────────────────────────────────
async function postAction(body) {
  return fetch(SCRIPT_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'text/plain'
    },
    body: JSON.stringify(body)
  });
}

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

let toastTimer;

function showToast(msg, isError) {
  const t = document.getElementById('toast');

  t.textContent = msg;

  t.className =
    'toast' +
    (isError ? ' error' : '') +
    ' show';

  clearTimeout(toastTimer);

  toastTimer = setTimeout(() => {
    t.classList.remove('show');
  }, 2800);
}

document.getElementById('dup-modal')
  .addEventListener('click', e => {
    if (e.target === e.currentTarget) {
      closeDupModal();
    }
  });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeDupModal();
  }

  if (
    e.key === 'Enter' &&
    document.getElementById('page-add').classList.contains('active')
  ) {
    addGuest();
  }
});
</script>
